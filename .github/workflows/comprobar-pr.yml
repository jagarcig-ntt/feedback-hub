# ─────────────────────────────────────────────────────────────────────────────
# COMPROBAR EL PR · el control de calidad automático (CI)
#
# Cuándo: cada vez que se abre o actualiza un Pull Request, y en cada push
#         a una rama que no sea main (incluidas las ramas de Lovable).
# Qué hace: instala, pasa las pruebas y comprueba que el proyecto compila.
# Qué necesita: nada. No usa ningún secreto.
#
# La regla de main exige que este check esté en verde para poder hacer merge.
# ─────────────────────────────────────────────────────────────────────────────
name: Comprobar el PR

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  comprobar:
    name: Comprobar el PR          # nombre del check que verás en el PR
    runs-on: ubuntu-latest
    steps:
      - name: 1. Coger el código
        uses: actions/checkout@v4

      - name: 2. Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: 4. Pasar las pruebas
        run: npm test

      - name: 5. Comprobar que compila
        run: npm run build

      # 11 de diciembre: aquí añadiremos el check de seguridad
      # (sesión "Seguridad y buenas prácticas con IA").
